name: diag-cookie
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check GLADOS_COOKIES validity
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          cookies = os.environ.get("GLADOS_COOKIES", "")
          print("cookie_len:", len(cookies))
          # 只取第一个 cookie 串（& 分隔多账号），脱敏显示
          first = cookies.split("&")[0] if cookies else ""
          masked = first[:30] + "..." + first[-20:] if first else "(empty)"
          print("first_cookie_masked:", masked)

          if not cookies:
              print("RESULT: NO_COOKIE")
              raise SystemExit(0)

          # 解析第一个 cookie 串为 header
          cookie_header = first.strip()

          req = urllib.request.Request(
              "https://glados.cloud/api/user/status",
              headers={
                  "Cookie": cookie_header,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode())
          except Exception as e:
              print("RESULT: NETWORK_ERROR", str(e)[:120])
              raise SystemExit(0)

          code = data.get("code")
          if code == 0:
              d = data.get("data", {})
              email = d.get("email", "?")
              email_masked = email[:2] + "***" + email.split("@")[-1] if email else "?"
              print("RESULT: COOKIE_VALID")
              print("userId:", d.get("userId"))
              print("email:", email_masked)
              print("leftDays:", d.get("leftDays"))
              print("vip:", d.get("vip"))
          elif code == 1:
              print("RESULT: COOKIE_OK_REPEAT", json.dumps(data.get("data", {}))[:100])
          elif code == -2:
              print("RESULT: COOKIE_INVALID (code=-2, 没有权限)")
              print("message:", data.get("message"))
          else:
              print("RESULT: OTHER code=", code, "message:", data.get("message"))
          PYEOF
